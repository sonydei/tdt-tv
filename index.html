<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDT Channels - Smart TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    #sidebar {
      width: 450px;
      height: 100%;
      background-color: #141414;
      border-right: 2px solid #333;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #main {
      flex-grow: 1;
      height: 100%;
      background-color: #000000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header {
      padding: 25px 20px;
      background-color: #1f1f1f;
      font-size: 22px;
      font-weight: bold;
      color: #00a8ff;
      border-bottom: 2px solid #333;
    }
    .channel-item {
      padding: 18px 20px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      font-size: 18px;
      display: block;
      color: #ddd;
      text-decoration: none;
    }
    .channel-item:focus, .channel-item:hover {
      background-color: #00a8ff;
      color: #fff;
      font-weight: bold;
      outline: none;
    }
    #video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #status-msg {
      position: absolute;
      font-size: 20px;
      color: #aaa;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div class="header">Canales TDT</div>
      <div id="channel-list"></div>
    </div>
    <div id="main">
      <div id="status-msg">Selecciona un canal de la lista</div>
      <video id="video-player" controls autoplay></video>
    </div>
  </div>

  <script>
    var m3uUrl = 'tv.m3u';
    var video = document.getElementById('video-player');
    var statusMsg = document.getElementById('status-msg');
    var channelListElem = document.getElementById('channel-list');
    var hls = null;

    function parseM3U(content) {
      var lines = content.split('\n');
      var channels = [];
      var currentName = '';

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (line.indexOf('#EXTINF:') === 0) {
          var commaIndex = line.lastIndexOf(',');
          if (commaIndex !== -1) {
            currentName = line.substring(commaIndex + 1).trim();
          } else {
            currentName = 'Canal sin nombre';
          }
        } else if (line.length > 0 && line.indexOf('#') !== 0) {
          if (currentName !== '') {
            channels.push({ name: currentName, url: line });
            currentName = '';
          }
        }
      }
      return channels;
    }

    function playStream(url, name) {
      statusMsg.style.display = 'block';
      statusMsg.innerText = 'Cargando ' + name + '...';

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: false });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          statusMsg.style.display = 'none';
          video.play();
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal) {
            statusMsg.innerText = 'El canal "' + name + '" emite en un formato no compatible con esta Smart TV de 2017.';
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
          statusMsg.style.display = 'none';
          video.play();
        });
      } else {
        statusMsg.innerText = 'Reproducción HLS no soportada.';
      }
    }

    function renderChannels(channels) {
      channelListElem.innerHTML = '';
      for (var i = 0; i < channels.length; i++) {
        (function(channel) {
          var a = document.createElement('a');
          a.className = 'channel-item';
          a.innerText = channel.name;
          a.setAttribute('tabindex', '0');
          
          a.onclick = function(e) {
            e.preventDefault();
            playStream(channel.url, channel.name);
          };
          a.onkeydown = function(e) {
            if (e.keyCode === 13) {
              playStream(channel.url, channel.name);
            }
          };
          channelListElem.appendChild(a);
        })(channels[i]);
      }
    }

    var xhr = new XMLHttpRequest();
    xhr.open('GET', m3uUrl, true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && xhr.status === 200) {
        var channels = parseM3U(xhr.responseText);
        renderChannels(channels);
      }
    };
    xhr.send();
  </script>
</body>
</html>

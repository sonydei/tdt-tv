<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TDT Automática OLED</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: row;
            height: 95vh;
        }
        .reproductor-container {
            flex: 1.8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        video {
            width: 100%;
            max-height: 80%;
            background: #111;
            border: 4px solid #333;
            border-radius: 12px;
        }
        #nombre-canal-actual {
            font-size: 2.5rem;
            margin-top: 15px;
            color: #ff4500;
            font-weight: bold;
        }
        .lista-canales { 
            flex: 1.2;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 90vh;
        }
        .btn-canal { 
            background: #1c1c1e; 
            color: #ffffff; 
            border: 3px solid #2c2c2e;
            padding: 20px;
            font-size: 2rem; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }
        .btn-canal:hover, .btn-canal:focus { 
            background: #ff4500; 
            border-color: #ffffff; 
            outline: none;
        }
        #estado-carga {
            font-size: 2rem;
            color: #86868b;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="reproductor-container">
        <video id="video-player" controls autoplay muted playsinline></video>
        <div id="nombre-canal-actual">Cargando lista...</div>
    </div>

    <div class="lista-canales" id="contenedor-canales">
        <div id="estado-carga">Conectando con el repositorio de TDTChannels...</div>
    </div>

    <script>
        var video = document.getElementById('video-player');
        var titulo = document.getElementById('nombre-canal-actual');
        var contenedor = document.getElementById('contenedor-canales');
        var hls = null;

        // SOLUCIÓN DEFINITIVA: Leemos el archivo clonado directamente desde el GitHub original de la comunidad
        var urlListaM3U8 = "https://githubusercontent.com";

        fetch(urlListaM3U8)
            .then(response => {
                if (!response.ok) throw new Error("Error de conexión");
                return response.text();
            })
            .then(data => {
                parsearM3U8(data);
            })
            .catch(error => {
                document.getElementById('estado-carga').innerText = "Error al descargar los canales. Inténtalo de nuevo.";
                console.error(error);
            });

        function parsearM3U8(contenidoM3U8) {
            contenedor.innerHTML = "";
            var lineas = contenidoM3U8.split('\n');
            var nombreCanal = "";
            var primerCanalAsignado = false;

            for (var i = 0; i < lineas.length; i++) {
                var linea = lineas[i].trim();

                if (linea.startsWith('#EXTINF:')) {
                    var partes = linea.split(',');
                    nombreCanal = partes[partes.length - 1].trim();
                } 
                else if (linea.startsWith('http') && nombreCanal !== "") {
                    var urlCanal = linea;

                    var boton = document.createElement('button');
                    boton.className = 'btn-canal';
                    boton.innerText = nombreCanal;
                    
                    boton.setAttribute('onclick', `cambiarCanal('${urlCanal}', '${nombreCanal.replace(/'/g, "\\'")}')`);
                    contenedor.appendChild(boton);

                    if (!primerCanalAsignado) {
                        cambiarCanal(urlCanal, nombreCanal);
                        primerCanalAsignado = true;
                    }

                    nombreCanal = "";
                }
            }
        }

        function cambiarCanal(url, nombre) {
            titulo.innerText = "Cargando " + nombre + "...";
            
            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                    titulo.innerText = nombre;
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                    titulo.innerText = nombre;
                });
            }
        }
    </script>
</body>
</html>

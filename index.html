<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>IPTV LG TV</title>
  <!-- Librería HLS.js compatible con navegadores antiguos -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    #container { display: flex; width: 100vw; height: 100vh; }
    #menu { width: 400px; height: 100%; background: #111; border-right: 2px solid #222; overflow-y: auto; }
    #player-box { flex-grow: 1; height: 100%; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
    .channel-btn { padding: 20px; border-bottom: 1px solid #222; cursor: pointer; font-size: 18px; display: block; color: #ccc; background: none; width: 100%; text-align: left; border-left: none; border-right: none; border-top: none; }
    .channel-btn:focus, .channel-btn:hover { background: #00a8ff; color: #fff; outline: none; font-weight: bold; }
    video { width: 100%; height: 100%; object-fit: contain; }
    #info { position: absolute; font-size: 18px; color: #777; z-index: 5; pointer-events: none; }
  </style>
</head>
<body>
  <div id="container">
    <div id="menu">
      <div style="padding: 20px; background: #1a1a1a; font-size: 20px; font-weight: bold; color: #00a8ff;">Canales TV</div>
      <button class="channel-btn" onclick="cambiarCanal('https://stream.media-servers.es/torotv/hls/index.m3u8', 'Toro TV')">Toro TV</button>
      <button class="channel-btn" onclick="cambiarCanal('https://telemadrid-live.adaptive.level3.net/telemadrid/telemadrid.m3u8', 'Telemadrid')">Telemadrid</button>
      <button class="channel-btn" onclick="cambiarCanal('https://aragontv-live.adaptive.level3.net/aragontv/aragontv.m3u8', 'Aragon TV')">Aragon TV</button>
      <button class="channel-btn" onclick="cambiarCanal('https://rtvesecure-live.adaptive.level3.net/rtve/24h/index.m3u8', '24h RTVE')">24h RTVE</button>
    </div>
    <div id="player-box">
      <div id="info">Selecciona un canal con el mando</div>
      <video id="video" controls autoplay></video>
    </div>
  </div>

  <script>
    var video = document.getElementById('video');
    var info = document.getElementById('info');
    var hls = null;

    function cambiarCanal(url, nombre) {
      info.style.display = 'block';
      info.innerText = 'Cargando ' + nombre + '...';

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: false });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          info.style.display = 'none';
          video.play();
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal) {
            info.innerText = 'Error: Flujo no compatible con esta TV';
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
          info.style.display = 'none';
          video.play();
        });
      } else {
        info.innerText = 'Reproducción no soportada';
      }
    }
  </script>
</body>
</html>

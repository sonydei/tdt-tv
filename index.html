<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDT Web TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #050505;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    #sidebar {
      width: 450px;
      height: 100%;
      background-color: #111111;
      border-right: 2px solid #222;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #main {
      flex-grow: 1;
      height: 100%;
      background-color: #000000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header {
      padding: 25px 20px;
      background-color: #1a1a1a;
      font-size: 22px;
      font-weight: bold;
      color: #00a8ff;
      border-bottom: 2px solid #222;
    }
    .channel-item {
      padding: 18px 20px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      font-size: 18px;
      display: block;
      color: #ccc;
      text-decoration: none;
    }
    .channel-item:focus, .channel-item:hover {
      background-color: #00a8ff;
      color: #fff;
      font-weight: bold;
      outline: none;
    }
    #video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #status-msg {
      position: absolute;
      font-size: 20px;
      color: #777;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div class="header">Canales TDT</div>
      <div id="channel-list"></div>
    </div>
    <div id="main">
      <div id="status-msg">Selecciona un canal para comenzar</div>
      <video id="video-player" controls autoplay></video>
    </div>
  </div>

  <script>
    var video = document.getElementById('video-player');
    var statusMsg = document.getElementById('status-msg');
    var channelListElem = document.getElementById('channel-list');
    var hls = null;

    // Lista embebida directa para evitar problemas de carga externa CORS en webOS
    var channels = [
      { name: "Toro TV", url: "https://stream.media-servers.es/torotv/hls/index.m3u8" },
      { name: "Telemadrid", url: "https://telemadrid-live.adaptive.level3.net/telemadrid/telemadrid.m3u8" },
      { name: "Aragon TV", url: "https://aragontv-live.adaptive.level3.net/aragontv/aragontv.m3u8" },
      { name: "24h RTVE", url: "https://rtvesecure-live.adaptive.level3.net/rtve/24h/index.m3u8" },
      { name: "Europa Press", url: "https://europapress-live.hls.live-video.net/v1/p/ed281e01-50e5-4a57-b0b3-fdf441400bc0/master.m3u8" }
    ];

    function playStream(url, name) {
      statusMsg.style.display = 'block';
      statusMsg.innerText = 'Conectando con ' + name + '...';

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: false,
          lowLatencyMode: true,
          backBufferLength: 90
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          statusMsg.style.display = 'none';
          var playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(function(error) {
              console.log("Autoplay bloqueado:", error);
            });
          }
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal) {
            switch(data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                statusMsg.innerText = 'Error de red o CORS en ' + name;
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                statusMsg.innerText = 'Error de decodificación en ' + name;
                hls.recoverMediaError();
                break;
              default:
                statusMsg.innerText = 'Formato no compatible en esta TV';
                hls.destroy();
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
          statusMsg.style.display = 'none';
          video.play();
        });
      } else {
        statusMsg.innerText = 'El navegador no soporta HLS.';
      }
    }

    function renderChannels() {
      channelListElem.innerHTML = '';
      for (var i = 0; i < channels.length; i++) {
        (function(channel) {
          var a = document.createElement('a');
          a.className = 'channel-item';
          a.innerText = channel.name;
          a.setAttribute('tabindex', '0');
          
          a.onclick = function(e) {
            e.preventDefault();
            playStream(channel.url, channel.name);
          };
          a.onkeydown = function(e) {
            if (e.keyCode === 13) {
              playStream(channel.url, channel.name);
            }
          };
          channelListElem.appendChild(a);
        })(channels[i]);
      }
    }

    renderChannels();
  </script>
</body>
</html>

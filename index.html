<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDT TV Ajustada</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }
    /* Contenedor que estira y ajusta el reproductor oficial de TDTChannels a pantalla completa */
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <!-- Puedes cambiar la URL del iframe al canal que desees de TDTChannels -->
    <iframe src="https://player.tdtchannels.com/television/La1" allowfullscreen></iframe>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TDT OLED</title>
    <!-- Librería HLS para activar la reproducción en webOS antiguo -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: row;
            height: 95vh;
        }
        /* Bloque de reproducción (Izquierda) */
        .reproductor-container {
            flex: 1.8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        video {
            width: 100%;
            max-height: 80%;
            background: #111;
            border: 4px solid #333;
            border-radius: 12px;
        }
        #nombre-canal-actual {
            font-size: 2.5rem;
            margin-top: 15px;
            color: #ff4500;
            font-weight: bold;
        }
        /* Bloque de canales (Derecha) */
        .lista-canales { 
            flex: 1.2;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 90vh;
        }
        .btn-canal { 
            background: #1c1c1e; 
            color: #ffffff; 
            border: 3px solid #2c2c2e;
            padding: 20px;
            font-size: 2rem; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }
        /* Enfoque optimizado para el Magic Remote de LG */
        .btn-canal:hover, .btn-canal:focus { 
            background: #ff4500; 
            border-color: #ffffff; 
            outline: none;
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR -->
    <div class="reproductor-container">
        <video id="video-player" controls autoplay muted playsinline></video>
        <div id="nombre-canal-actual">Selecciona un canal</div>
    </div>

    <!-- BOTONERA DIRECTA (URLs de tu archivo M3U) -->
    <div class="lista-canales">
        <button class="btn-canal" onclick="cambiarCanal('https://rtve.es', 'La 1')">La 1</button>
        <button class="btn-canal" onclick="cambiarCanal('https://rtve.es', 'La 2')">La 2</button>
        <button class="btn-canal" onclick="cambiarCanal('https://enetres.net', 'TRECE')">TRECE</button>
        <button class="btn-canal" onclick="cambiarCanal('https://rtve.es', 'Canal 24h')">Canal 24h</button>
        <button class="btn-canal" onclick="cambiarCanal('https://rtve.es', 'Teledeporte')">Teledeporte</button>
        <button class="btn-canal" onclick="cambiarCanal('https://rtve.es', 'Clan TV')">Clan TV</button>
        <button class="btn-canal" onclick="cambiarCanal('https://3catdirectes.cat', 'TV3')">TV3</button>
        <button class="btn-canal" onclick="cambiarCanal('https://cloudfront.net', 'Canal Sur')">Canal Sur</button>
        <button class="btn-canal" onclick="cambiarCanal('https://etbon.eus', 'ETB 1')">ETB 1</button>
        <button class="btn-canal" onclick="cambiarCanal('https://etbon.eus', 'ETB 2')">ETB 2</button>
        <button class="btn-canal" onclick="cambiarCanal('https://flumotion.cloud', 'TVG Galicia')">TVG Galicia</button>
        <button class="btn-canal" onclick="cambiarCanal('https://akamaized.net', 'Real Madrid TV')">Real Madrid TV</button>
    </div>

    <script>
        var video = document.getElementById('video-player');
        var titulo = document.getElementById('nombre-canal-actual');
        var hls = null;

        function cambiarCanal(url, nombre) {
            titulo.innerText = "Cargando " + nombre + "...";
            
            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                    titulo.innerText = nombre;
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                    titulo.innerText = nombre;
                });
            }
        }

        // Carga automática del primer canal al iniciar
        window.onload = function() {
            cambiarCanal('https://rtve.es', 'La 1');
        };
    </script>
</body>
</html>

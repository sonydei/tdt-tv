<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TDT Directa LG</title>
    <style>
        /* Optimizado al 100% para pantallas OLED (Negro Puro) y mando de la TV */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            text-align: center; 
            margin: 0; 
            padding: 40px 20px;
        }
        h1 { 
            font-size: 3.5rem; 
            margin-bottom: 5px; 
            color: #f5f5f7;
        }
        p {
            font-size: 1.6rem;
            color: #ff4500;
            margin-bottom: 50px;
            font-weight: bold;
        }
        .contenedor-botones { 
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 600px; 
            margin: 0 auto; 
            padding: 0 20px;
        }
        .btn-canal { 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 110px;
            background: #121212; 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 2.6rem; 
            font-weight: bold; 
            border-radius: 20px; 
            border: 4px solid #2c2c2e;
            transition: all 0.15s ease;
            cursor: pointer;
        }
        /* Efecto de resalte de color naranja cuando pasas el puntero del mando */
        .btn-canal:hover, .btn-canal:focus { 
            background: #ff4500; 
            border-color: #ffffff; 
            transform: scale(1.04);
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.6);
            outline: none;
        }
    </style>
</head>
<body>

    <h1>Mi TDT Directa</h1>
    <p>Pulsa un canal para abrir el reproductor nativo de tu TV</p>

    <div class="contenedor-botones">
        <!-- Al hacer clic, webOS intercepta el .m3u8 y abre el canal a pantalla completa -->
        <a class="btn-canal" href="https://rtve.es">La 1</a>
        <a class="btn-canal" href="https://rtve.es">La 2</a>
        <a class="btn-canal" href="https://eltorotv.com">El Toro TV</a>
        <a class="btn-canal" href="https://enetres.net">TRECE</a>
    </div>

</body>
</html>
